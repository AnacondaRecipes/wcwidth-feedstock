{% set name = "wcwidth" %}
{% set version = "0.9.4" %}
{% set ignore_tests = "" %}
{% set ignore_tests = ignore_tests + " --ignore=tests/test_check_release.py" %}
{% set ignore_tests = ignore_tests + " --ignore=tests/test_setup.py" %}
{% set ignore_tests = 'ignore_tests + " --deselect=tests/test_core.py::test_cmake_and_setuptools_source_lists_parity"' %}
{% set ignore_tests = 'ignore_tests + " --deselect=tests/test_core.py::test_version_matches_pyproject"' %}
{% set ignore_tests = 'ignore_tests + " --deselect=tests/test_core.py::test_version_matches_libwcwidth"' %}

# exercises bin/check-release.py (upstream's cibuildwheel release gate), not shipped here
# exercises setup.py directly (build-script unit tests), not shipped here
# checks pyproject.toml/libwcwidth source parity, not shipped here
package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: fd8d57d3cdfe570e3265c8fab1885c24e34ef40889c0759c0c304a19e9835954

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<39]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools >=61
  run:
    - python

test:
  source_files:
    - tests
    - bin/verify-table-integrity.py  # [py>311]
  imports:
    - wcwidth
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -vv tests {{ ignore_tests }}
  requires:
    - pip
    - pytest >=7.4.2

about:
  home: https://github.com/jquast/wcwidth
  summary: Measures number of Terminal column cells of wide-character codes.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  description: This library is mainly for CLI programs that carefully produce output for Terminals, or make pretend to be an emulator.
  doc_url: https://github.com/jquast/wcwidth/blob/master/docs/intro.rst
  dev_url: https://github.com/jquast/wcwidth

extra:
  recipe-maintainers:
    - ocefpaf
