{% set name = "wcwidth" %}
{% set version = "0.9.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: ae0ef90b90f6af38b54f1fe6d58662ec33b3cb4b8391958a62416d654231727b

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<39]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools >=61
  run:
    - python

test:
  source_files:
    - tests
    - bin/verify-table-integrity.py  # [py>311]
    - bin/check-release.py
  imports:
    - wcwidth
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -vv tests
  requires:
    - pip
    - pytest >=7.4.2

about:
  home: https://github.com/jquast/wcwidth
  summary: Measures number of Terminal column cells of wide-character codes.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  description: This library is mainly for CLI programs that carefully produce output for Terminals, or make pretend to be an emulator.
  doc_url: https://github.com/jquast/wcwidth/blob/master/docs/intro.rst
  dev_url: https://github.com/jquast/wcwidth

extra:
  recipe-maintainers:
    - ocefpaf
